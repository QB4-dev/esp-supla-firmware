name: Build All Supla Firmware Boards

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: Build all ESP32 variants using ESP-IDF ---
  build-esp32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_name: "ESP32-NodeMCU"
            board_path: "boards/ESP32/NodeMCU"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build ESP32 Firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        target: 'esp32'
        esp_idf_version: 'v5.5'
        path: ${{ matrix.board_path }}

    - name: Upload ESP32 Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.board_name }}-binaries  # 👈 Slashes replaced with safe dashes
        path: |
          ${{ matrix.board_path }}/build/*.bin
          ${{ matrix.board_path }}/build/bootloader/bootloader.bin
          ${{ matrix.board_path }}/build/partition_table/partition-table.bin

  # --- JOB 2: Build all ESP8266 variants using Legacy Make & RTOS-SDK ---
  build-esp8266:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_name: "ESP8266-NodeMCU"
            board_path: "boards/ESP8266/NodeMCU"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Toolchain and SDK Dependencies
      run: |
        sudo apt-get update
        # Replaced deprecated python package dependencies with explicit python3 dependencies
        sudo apt-get install -y gcc git wget make libncurses-dev flex bison gperf python3 python3-pip python3-serial

    - name: Setup ESP8266 RTOS SDK & GCC Toolchain
      run: |
        # Fixed broken wget link—now explicitly fetching the official Linux 64-bit toolchain package
        wget https://espressif.com
        tar -xzf xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz
        
        # Clone your specific project fork of the SDK
        git clone --recursive --branch master https://github.com/QB4-dev/ESP8266_RTOS_SDK
        
        python3 -m pip install -r ESP8266_RTOS_SDK/requirements.txt

    - name: Run Build (Make)
      run: |
        # Fixed path resolution context—mapping toolchain location relative to the execution workspace
        export PATH=$GITHUB_WORKSPACE/xtensa-lx106-elf/bin:$PATH
        export IDF_PATH=$GITHUB_WORKSPACE/ESP8266_RTOS_SDK
        
        cd ${{ matrix.board_path }}
        make defconfig
        make

    - name: Upload ESP8266 Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.board_name }}-binaries  # 👈 Slashes replaced with safe dashes
        path: ${{ matrix.board_path }}/build/*.bin
