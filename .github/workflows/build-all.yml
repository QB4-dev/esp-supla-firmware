name: Build All Supla Firmware Boards

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: Build all ESP32 variants using ESP-IDF ---
  build-esp32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board_path:
          - "boards/ESP32/NodeMCU"
          - "boards/ESP32/ESP32-RELAY-AC-X1"
          - "boards/ESP32/ESP32-S3-RELAY-6CH"
          - "boards/ESP32/Sonoff-Mini-R4"
          - "boards/ESP32/Sonoff-Mini-R4-BLE"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Determine ESP-IDF target
      id: target
      env:
        BOARD_PATH: ${{ matrix.board_path }}
      shell: bash
      run: |
        target=esp32
        defaults_file="${BOARD_PATH}/sdkconfig.defaults"
        if [[ -f "$defaults_file" ]]; then
          configured_target=$(sed -n 's/^CONFIG_IDF_TARGET="\([^"]*\)"/\1/p' "$defaults_file" | head -n1)
          if [[ -n "$configured_target" ]]; then
            target="$configured_target"
          fi
        fi
        echo "target=$target" >> "$GITHUB_OUTPUT"

    - name: Build ESP32 Firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        target: ${{ steps.target.outputs.target }}
        esp_idf_version: 'v5.5'
        path: ${{ matrix.board_path }}

    - name: Derive board name
      id: board
      env:
        BOARD_PATH: ${{ matrix.board_path }}
      shell: bash
      run: |
        name="${BOARD_PATH#boards/}"
        echo "name=${name//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload ESP32 Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.board.outputs.name }}
        path: |
          ${{ matrix.board_path }}/build/*.bin
          ${{ matrix.board_path }}/build/bootloader/bootloader.bin
          ${{ matrix.board_path }}/build/partition_table/partition-table.bin

  # --- JOB 2: Build all ESP8266 variants using Legacy Make & RTOS-SDK ---
  build-esp8266:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board_path:
          - "boards/ESP8266/NodeMCU"
          - "boards/ESP8266/ESP01-DIMMER"
          - "boards/ESP8266/ESP01-RGBW"
          - "boards/ESP8266/ESP12F_Relay_X4"
          - "boards/ESP8266/MP46WiFi"
          - "boards/ESP8266/SONOFF-BASIC-R2"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Toolchain and SDK Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc git wget make libncurses-dev flex bison gperf python3 python3-pip python3-serial

    - name: Setup ESP8266 RTOS SDK & Automated Toolchain
      run: |
        # Clone official ESP8266 RTOS SDK into a local framework folder
        git clone --recursive --branch master https://github.com/QB4-dev/ESP8266_RTOS_SDK $GITHUB_WORKSPACE/ESP8266_RTOS_SDK
        
        # Install Python dependencies required by the Espressif system framework
        python3 -m pip install -r $GITHUB_WORKSPACE/ESP8266_RTOS_SDK/requirements.txt
        
        # Use Espressif's native install tool to securely fetch matching binaries 
        # (This replaces the broken wget step safely)
        $GITHUB_WORKSPACE/ESP8266_RTOS_SDK/install.sh

    - name: Run Build (Make)
      run: |
        # Export paths directly out of the native Espressif environment layout setup
        export IDF_PATH=$GITHUB_WORKSPACE/ESP8266_RTOS_SDK
        export PATH=$HOME/.espressif/tools/xtensa-lx106-elf/esp-2020r3-49-gd5524c1-8.4.0/xtensa-lx106-elf/bin:$PATH
        
        # Move into the specific board directory and compile via legacy Make
        cd ${{ matrix.board_path }}
        make defconfig
        make -j$(nproc)

    - name: Derive board name
      id: board
      env:
        BOARD_PATH: ${{ matrix.board_path }}
      shell: bash
      run: |
        name="${BOARD_PATH#boards/}"
        echo "name=${name//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload ESP8266 Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.board.outputs.name }}
        path: ${{ matrix.board_path }}/build/*.bin
